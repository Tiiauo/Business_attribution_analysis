[project]
name = "business-attribution-analysis"
version = "0.1.0"
description = "Multi-turn business attribution analysis system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "asyncpg>=0.32.0,<0.33.0",
    "authlib>=1.9.1,<2.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "fastapi>=0.161.1,<0.162.0",
    "httpx2>=2.16.0,<3.0.0",
    "joserfc>=1.7.7,<2.0.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "python-multipart>=0.0.32,<0.0.33",
    "sqlalchemy[asyncio]>=2.1.6,<3.0.0",
    "sqlglot>=30.24.0",
    "tzdata>=2026.5,<2027.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.17.2,<0.18.0",
]
